<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的html学习</title>
    <style>
        /* 所有img标签都生效 */
        img {
            width: 300px; /* 统一宽度 */
            height: auto; /* 高度自动 */
            margin-top: 10px; /* 上边距 */
        }
    </style>
</head>
<body>
    <!-- 标签：双头标签 -->
    <h1>Hello html</h1>
    <p>这是一个段落</p>
    <div class="box"></div>
    <div class="box1"></div>
    <div class="box"></div>
    <a href="https://www.runoob.com">这是一个链接使用了href属性，用标签a定义</a>

    <!-- 单头标签 -->
    <input type="text">
    <img 
        src="https://c-ssl.duitang.com/uploads/item/202003/16/20200316083724_bcgkz.jpg"
        alt="帅气坤坤图片"
        width="150"
        style="width: 300px; height: auto; margin-top: 10px;"
    >
    <br>    <!-- br换行 -->
    <br />  <!-- 推荐兼容性写法 -->

    <style>
        .box{
            margin-top: 10px;
            width: 100px;
            height: 100px;
            background-color: rgb(224, 159, 159);
        }
        .box1{
            margin-top: 10px;
            width: 100px;
            height: 100px;
            background-color: rgb(76, 94, 207);
        }.box{
            margin-top: 10px;
            width: 100px;
            height: 100px;
            background-color: rgb(224, 159, 159);
        }
    </style>

</body>
</html>
